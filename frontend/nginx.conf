server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths return index.html, React Router handles the rest
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite fingerprints filenames on each build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
